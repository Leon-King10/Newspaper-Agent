name: Daily News Digest

on:
  schedule:
    # 02:42 UTC = 8:42 AM Asia/Dhaka. Scheduled a bit before 9 AM, on an
    # off-peak minute (top-of-hour crons sit in GitHub's most congested queue
    # and routinely slip 15 min–1 hr+). GitHub does NOT guarantee on-time runs;
    # for punctual delivery, run `python main.py` from a real cron on a VPS.
    # The news window is fixed to 9 AM→9 AM regardless of send time, so a late
    # run still contains exactly the right day's news.
    - cron: "42 2 * * *"
  workflow_dispatch:       # Allows manual trigger from GitHub Actions tab

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news digest
        run: python main.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS || secrets.RECIPIENT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LOCAL_TIMEZONE: Asia/Dhaka
