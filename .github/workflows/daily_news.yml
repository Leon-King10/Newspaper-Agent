name: Daily News Digest

on:
  schedule:
    # Run 1: 02:42 UTC = ~8:42 AM Asia/Dhaka (morning edition)
    # Run 2: 13:12 UTC = ~7:12 PM Asia/Dhaka (evening edition, ~10.5 hrs later)
    # Off-peak minutes avoid GitHub's congested queue. Runs may still slip.
    # The news window is fixed to 9 AM→9 AM so late runs still get the right day's news.
    - cron: "42 2 * * *"
    - cron: "12 13 * * *"
  workflow_dispatch:       # Allows manual trigger from GitHub Actions tab

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news digest
        run: python main.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS || secrets.RECIPIENT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LOCAL_TIMEZONE: Asia/Dhaka
